# Nginx acting as the "Application Load Balancer"

# Docker's embedded DNS server. Re-resolve every 5s so replicas added or
# removed by the autoscaler join/leave the pool without restarting nginx
# (like an ALB target group registering/deregistering instances).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app_servers {
    # Shared memory zone: required for `resolve`, and makes all nginx worker
    # processes share one round-robin state (without it, each worker starts
    # at the first server independently).
    zone app_servers 64k;

    # Default strategy: round-robin.
    # Alternatives to try:
    #   least_conn;   -> send to the instance with fewest active connections
    #   ip_hash;      -> sticky sessions (same client -> same instance)

    # "app" is the Compose service name; Docker DNS returns one IP per replica.
    # Passive health checks: skip a target for 10s after 2 failures.
    server app:8000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;

        # If a target fails (e.g. it was just scaled in), retry on the next one
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Expose which backend served the request (handy for debugging)
        add_header X-Upstream-Server $upstream_addr always;
    }

    # Health check of the load balancer itself
    location /lb-health {
        access_log off;
        return 200 "load balancer OK\n";
        add_header Content-Type text/plain;
    }
}
